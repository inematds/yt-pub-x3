<script>
'use strict';
const app=document.getElementById('app');let VG=null,vgD={},E=null,F=null,sel=null,tab='rs',filtro='todos',det=null,vista='canais',avisoH='',pedido=0,espera=0;const per={},draft={},aberta={},fFila={q:'',tipo:'',canal:''},fCanal={q:'',tipo:'',status:''},fMarca={marca:'',canal:''};

const ACS={aguardando:['pausar','pular'],pausado:['retomar','pular'],erro:['reenviar','pular'],conferir:['confirmar','reenviar','pular'],ignorado:['reenviar']};
const ROT={pausar:'Pausar',pular:'Pular',retomar:'Retomar',reenviar:'Reenviar',confirmar:'Já publicou'};

function dados(c){const l=c.legado||{},i=l.imports||[0,0,0,0,0],k=l.clips||[0,0,0,0,0],y=l.yt||[0,0,0,'–',0],y3=c.destinos.youtube.n,r3=c.destinos.rs.n;
 const p24=i[4]+k[4]+y[4],x24=y3.h24||0,hs=[...c.youtube.horarios,...c.clipes.horarios].sort(),nh=hs.length,est=c.semana>c.vagas,filaA=i[1]||0,filaX=y3.aguardando||0,fila=filaA+filaX;
 const paus=!c.destinos.youtube.ligado,pz=c.destinos.youtube.pausa;let nv='ok',st='Normal';
 if(pz){nv='bad';st='YouTube pausado'}else if(paus){nv='off';st='Desligado'}else if(!nh){nv='off';st='Sem horário'}else if(est){nv='bad';st='Não cabe'}else if(fila>30){nv='warn';st='Fila cheia'}
 return{l,i,k,y,y3,r3,p24,x24,hs,nh,est,fila,filaA,filaX,nv,st,tot:i[2]+k[2]+y[2]}}
function listaLinks(c){const r=c.rs;return[['YouTube',c.url],['Metricool',r.provedor&&r.blog_id?'https://app.metricool.com/planner/calendar?blogId='+r.blog_id:''],['Instagram',r.instagram?'https://www.instagram.com/'+r.instagram+'/':''],['TikTok',r.tiktok?'https://www.tiktok.com/@'+r.tiktok:'']]}

function prox(h){const d=new Date(),a=String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'),l=[...h].sort();return l.length?(l.find(x=>x>a)||'amanhã '+l[0]):'sem horário'}

function caixas(c,d){const r=c.rs,R=d.r3,Y=d.y3,D=c.destinos.youtube,C=D.clipes||{},v=(o,k)=>o[k]||0,im=k=>v(Y,k)-v(C,k),hy=c.youtube.horarios,hc=c.clipes.horarios,I=d.i,K=d.k,T=d.y;
 return '<div class="pipes">'+caixa('cut','blue','Clips',K[4]+v(C,'h24'),hc.length?hc.length+'/dia':'–',proxDestino(c,D,hc.length?hc:hy),K[1]+v(C,'aguardando'),K[2]+v(C,'feito'),K[3]+v(C,'erro'),`24 h: atuais ${K[4]} · x3 ${v(C,'h24')}`)
 +caixa('','green','YouTube',I[4]+T[4]+im('h24'),hy.length+'/dia',proxDestino(c,D,hy),I[1]+im('aguardando'),I[2]+T[2]+im('feito'),I[3]+im('erro'),`24 h: atuais ${I[4]+T[4]} · x3 ${im('h24')}`)
 +caixa('rs','pink','RS',R.h24||0,r.provedor?r.horarios.length+'/dia':'–',r.provedor?proxDestino(c,c.destinos.rs,r.horarios):'sem RS',R.aguardando||0,R.feito||0,R.erro||0,r.provedor?r.marca+' · '+r.redes.join(' + '):(r.nota||'Sem marca'))+'</div>'}
function grafico(sr,chave,titulo){const n=per[chave]||14,d=E.dias_serie.slice(-n),y=sr.yt.slice(-n),r=sr.rs.slice(-n),t=y.map((v,i)=>v+r[i]),m=Math.max(1,...t),W=320,H=60,s=W/Math.max(1,n-1),X=i=>(i*s).toFixed(1),Y=v=>(H-3-v/m*(H-9)).toFixed(1),L=a=>a.map((v,i)=>X(i)+','+Y(v)).join(' '),dt=x=>x.slice(8,10)+'/'+x.slice(5,7),lg=(c,x,v)=>`<span class="lg"><i class="${c}"></i>${x} <b>${v}</b></span>`;
 return `<div class="chart"><div class="ch"><span>${titulo||'Envios por dia'}</span><div class="ct">${[7,14,30].map(x=>`<button class="cb ${n==x?'on':''}" data-per="${esc(chave)}:${x}">${x}d</button>`).join('')}</div></div><svg viewBox="0 0 320 60" preserveAspectRatio="none" role="img" aria-label="Em ${n} dias: ${soma(t)} envios, ${soma(y)} no YouTube e ${soma(r)} nas redes"><polygon points="0,60 ${L(t)} 320,60" fill="rgba(161,161,170,.2)"/><polyline points="${L(t)}" fill="none" stroke="#a1a1aa" stroke-width="1" vector-effect="non-scaling-stroke"/><polyline points="${L(y)}" fill="none" stroke="#4ade80" stroke-width="2" vector-effect="non-scaling-stroke"/><polyline points="${L(r)}" fill="none" stroke="#f472b6" stroke-width="2" vector-effect="non-scaling-stroke"/>${d.map((x,i)=>`<rect class="hit" x="${Math.max(0,i*s-s/2).toFixed(1)}" y="0" width="${s.toFixed(1)}" height="60"><title>${dt(x)}: ${t[i]} envios · YouTube ${y[i]} · RS ${r[i]}</title></rect>`).join('')}</svg><div class="cf"><span>${dt(d[0])}</span><span class="lgs">${lg('lt','Total',soma(t))}${lg('ly','YT',soma(y))}${lg('lr','RS',soma(r))}</span><span>hoje</span></div></div>`}

function tela(){if(!E)return;const top=scrollY,fo=document.activeElement,campo=fo&&fo.dataset?fo.dataset.bf:'',ini=campo==='q'?fo.selectionStart:0,fim=campo==='q'?fo.selectionEnd:0;document.title=sel?sel+' · YT-Pub X3':'YT-Pub X3 Master';app.innerHTML=`<header><h1><a class="home" href="/" title="Ir para a página principal"><span>YT-Pub</span> X3 Master</a></h1><div class="meta"><span class="badge ${E.publicando?'on':'p'}">${E.publicando?'Publicando de verdade':'Simulação: nada é publicado'}</span><span class="badge">v${esc(E.versao)}</span><span>${esc(E.agora)}</span></div></header>${sel?telaCanal():vista==='filas'?telaFilas():vista==='marcas'?telaMarcas():telaGeral()}`;if(campo){const n=app.querySelector(`[data-bf="${campo}"]`);if(n){n.focus({preventScroll:true});if(campo==='q')n.setSelectionRange(ini,fim)}}scrollTo(0,top)}

app.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset;if(d.vista){vista=d.vista;carregar()}else if(d.fq){aberta[d.fq]=!aberta[d.fq];tela()}else if(d.hh){const p=d.hh.split('/'),H=p.pop(),k=p.join('/'),a=atual(k),t=a.h.filter(x=>x.slice(0,2)===H);a.h=t.length?a.h.filter(x=>x.slice(0,2)!==H):[...a.h,H+':'+a.m].sort();tela()}else if(d.ht){const p=d.ht.split('/'),o=p.pop(),k=p.join('/'),a=atual(k);a.h=o==='limpar'?[]:[...Array(24).keys()].map(i=>String(i).padStart(2,'0')+':'+a.m);tela()}else if(d.hs)salvaH(d.hs);else if(d.f){filtro=d.f;tela()}else if(d.per){const[c,n]=d.per.split(':');per[c]=+n;tela()}else if(d.limpa){Object.keys(filtroAtual()).forEach(k=>filtroAtual()[k]='');carregar()}else if(d.tab){tab=d.tab;if(tab==='vg'){VG=null;carregar()}tela()}else if(d.vg)post('/api/vigia/'+d.vg);else if(d.vap){vgD.auto_pausa=d.vap==='1';tela()}else if(d.vcr){vgD={...VG.padrao};tela()}else if(d.vcs)salvaVg();else if(d.ent)post('/api/entrega/'+d.ent);else if(d.sw)post('/api/destino/'+d.sw)});
